name: Update BC Lions Moabit Data

on:
  schedule:
    - cron: '0 10 * * *'  # Daily at 10:00 AM UTC (full update)
  workflow_dispatch:
    inputs:
      update_type:
        description: 'Select what to update'
        required: true
        default: 'full'
        type: choice
        options:
        - 'full'
        - 'calendars-only'
        - 'games-only'
      force_update:
        description: 'Force update even if no changes detected'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: |
        echo "Running comprehensive test suite..."
        npm test
        echo "All tests passed ✅"
    
    - name: Determine update type
      id: update_type
      run: |
        if [ "${{ github.event_name }}" = "schedule" ]; then
          echo "type=full" >> $GITHUB_OUTPUT
          echo "Update triggered by schedule - running full update"
        else
          echo "type=${{ github.event.inputs.update_type }}" >> $GITHUB_OUTPUT
          echo "Update triggered manually - type: ${{ github.event.inputs.update_type }}"
        fi
      
    - name: Run full build process
      if: steps.update_type.outputs.type == 'full'
      run: |
        echo "🔄 Starting full build process (games + calendars + HTML)..."
        npm run build
        echo "✅ Full build process completed"
        
    - name: Run calendars-only build
      if: steps.update_type.outputs.type == 'calendars-only'
      run: |
        echo "📅 Starting calendars-only build (calendars + HTML)..."
        npm run build:calendars
        echo "✅ Calendars-only build completed"
        
    - name: Run games-only build
      if: steps.update_type.outputs.type == 'games-only'
      run: |
        echo "🏀 Starting games-only build (games + HTML)..."
        npm run build:games
        echo "✅ Games-only build completed"
        
    - name: Summary
      run: |
        echo "## Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # Add update type specific summary
        case "${{ steps.update_type.outputs.type }}" in
          "full")
            echo "### 🔄 Full Update Completed" >> $GITHUB_STEP_SUMMARY
            echo "- 🏀 Fetched games for all 22 BC Lions Moabit teams" >> $GITHUB_STEP_SUMMARY
            echo "- 📅 Downloaded 7 training calendars from Google Calendar" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 Downloaded 1 termine calendar" >> $GITHUB_STEP_SUMMARY
            echo "- 📄 Generated all ICS files with parallel processing" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 Rebuilt HTML website" >> $GITHUB_STEP_SUMMARY
            ;;
          "calendars-only")
            echo "### 📅 Calendars-Only Update Completed" >> $GITHUB_STEP_SUMMARY
            echo "- 📅 Downloaded 7 training calendars from Google Calendar" >> $GITHUB_STEP_SUMMARY
            echo "- 📋 Downloaded 1 termine calendar" >> $GITHUB_STEP_SUMMARY
            echo "- 📄 Generated calendar ICS files" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 Rebuilt HTML website" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ **Fast**: Skipped games data (450+ API calls saved)" >> $GITHUB_STEP_SUMMARY
            ;;
          "games-only")
            echo "### 🏀 Games-Only Update Completed" >> $GITHUB_STEP_SUMMARY
            echo "- 🏀 Fetched games for all 22 BC Lions Moabit teams" >> $GITHUB_STEP_SUMMARY
            echo "- 📄 Generated games ICS files" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 Rebuilt HTML website" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ **Fast**: Skipped calendar downloads" >> $GITHUB_STEP_SUMMARY
            ;;
        esac
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🚀 Technical Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Architecture**: Modular services with dependency injection" >> $GITHUB_STEP_SUMMARY
        echo "- **Quality**: 279 comprehensive tests ensuring reliability" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered**: ${{ github.event_name == 'schedule' && 'Scheduled (daily at 10:00 UTC)' || 'Manual dispatch' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Result**: ✅ Website rebuilt and uploaded for deployment" >> $GITHUB_STEP_SUMMARY

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    needs: update-data
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4